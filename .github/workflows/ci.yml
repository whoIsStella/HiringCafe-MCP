name: Adapter tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install adapter
        run: pip install .
      - name: Test local interface and diagnostics
        run: python -m unittest discover -s tests -v
